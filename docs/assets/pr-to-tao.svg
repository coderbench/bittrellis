<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.card{fill:#f6f8fa;stroke:#d0d7de}.accent{fill:#f3efff;stroke:#8b5cf6}
.t{fill:#1f2328}.m{fill:#59636e}.rule{stroke:#d0d7de}.track{fill:#e6e9ed}.gpu{stroke:#1f2328}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.accent{fill:#1d1633;stroke:#8b5cf6}
.t{fill:#e6edf3}.m{fill:#9198a1}.rule{stroke:#30363d}.track{fill:#21262d}.gpu{stroke:#e6edf3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="1199" height="199" rx="12"/>
<line class="rule" x1="152.0" y1="52" x2="1048.0" y2="52" stroke-width="2"/>
<circle cx="152.0" cy="52" r="18" fill="#5b8def"/>
<text x="152.0" y="57.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text>
<text x="152.0" y="102.0" class="t" font-size="16" font-weight="600" text-anchor="middle">Open a PR</text>
<text x="152.0" y="126.0" class="m" font-size="13" font-weight="400" text-anchor="middle">a recipe, or a new</text>
<text x="152.0" y="145.0" class="m" font-size="13" font-weight="400" text-anchor="middle">encoder plus its recipe</text>
<circle cx="376.0" cy="52" r="18" fill="#5b8def"/>
<text x="376.0" y="57.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text>
<text x="376.0" y="102.0" class="t" font-size="16" font-weight="600" text-anchor="middle">Screen</text>
<text x="376.0" y="126.0" class="m" font-size="13" font-weight="400" text-anchor="middle">no GPU: duplicates,</text>
<text x="376.0" y="145.0" class="m" font-size="13" font-weight="400" text-anchor="middle">copies, memory, encoders</text>
<circle cx="600.0" cy="52" r="18" fill="#5b8def"/>
<text x="600.0" y="57.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text>
<text x="600.0" y="102.0" class="t" font-size="16" font-weight="600" text-anchor="middle">Measure</text>
<text x="600.0" y="126.0" class="m" font-size="13" font-weight="400" text-anchor="middle">quality, speed and memory</text>
<text x="600.0" y="145.0" class="m" font-size="13" font-weight="400" text-anchor="middle">on the real RTX 5090</text>
<circle cx="824.0" cy="52" r="18" fill="#5b8def"/>
<text x="824.0" y="57.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">4</text>
<text x="824.0" y="102.0" class="t" font-size="16" font-weight="600" text-anchor="middle">Tier label</text>
<text x="824.0" y="126.0" class="m" font-size="13" font-weight="400" text-anchor="middle">eval:XL … eval:XS from</text>
<text x="824.0" y="145.0" class="m" font-size="13" font-weight="400" text-anchor="middle">the frontier space it adds</text>
<circle cx="1048.0" cy="52" r="18" fill="#8b5cf6"/>
<text x="1048.0" y="57.0" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">5</text>
<text x="1048.0" y="102.0" class="t" font-size="16" font-weight="600" text-anchor="middle">Merge = paid</text>
<text x="1048.0" y="126.0" class="m" font-size="13" font-weight="400" text-anchor="middle">the bot merges the top result;</text>
<text x="1048.0" y="145.0" class="m" font-size="13" font-weight="400" text-anchor="middle">Gittensor pays the tier</text>
</svg>
