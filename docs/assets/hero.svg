<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<style>
.bg{fill:#ffffff;stroke:#d0d7de}.card{fill:#f6f8fa;stroke:#d0d7de}.accent{fill:#f3efff;stroke:#8b5cf6}
.t{fill:#1f2328}.m{fill:#59636e}.rule{stroke:#d0d7de}.track{fill:#e6e9ed}.gpu{stroke:#1f2328}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d}.card{fill:#161b22;stroke:#30363d}.accent{fill:#1d1633;stroke:#8b5cf6}
.t{fill:#e6edf3}.m{fill:#9198a1}.rule{stroke:#30363d}.track{fill:#21262d}.gpu{stroke:#e6edf3}}
</style>
<rect class="bg" x="0.5" y="0.5" width="1199" height="329" rx="12"/>
<text x="40.0" y="64.0" class="t" font-size="40" font-weight="700" text-anchor="start">BitTrellis</text>
<text x="40.0" y="96.0" class="m" font-size="17" font-weight="400" text-anchor="start">Finds the best way to compress a large language model for one specific GPU,</text>
<text x="40.0" y="120.0" class="m" font-size="17" font-weight="400" text-anchor="start">keeping as much of the original model's quality as possible.</text>
<rect class="card" x="40" y="152" width="336" height="150" rx="10"/>
<text x="60.0" y="186.0" class="t" font-size="17" font-weight="600" text-anchor="start">Original model</text>
<text x="60.0" y="210.0" class="m" font-size="13" font-weight="400" text-anchor="start">Qwen3.8-27B in full precision (BF16)</text>
<rect class="track" x="60" y="238" width="169.1" height="16" rx="3"/>
<rect x="60" y="238" width="169.1" height="16" rx="3" fill="#cf222e" opacity="0.85"/>
<rect x="229.1" y="238" width="105.7" height="16" rx="3" fill="#cf222e" opacity="0.35"/>
<line class="gpu" x1="229.1" y1="230" x2="229.1" y2="262" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="229.1" y="226.0" class="m" font-size="11" font-weight="400" text-anchor="middle">32 GB GPU</text>
<text x="60.0" y="282.0" fill="#cf222e" font-size="13" font-weight="600" text-anchor="start">52 GB · too big for a 32 GB GPU</text>
<rect class="accent" x="432" y="152" width="336" height="150" rx="10"/>
<text x="452.0" y="186.0" class="t" font-size="17" font-weight="600" text-anchor="start">BitTrellis</text>
<text x="452.0" y="210.0" class="m" font-size="13" font-weight="400" text-anchor="start">chooses the format and encoder</text>
<text x="452.0" y="230.0" class="m" font-size="13" font-weight="400" text-anchor="start">for each part of the model</text>
<rect x="452" y="245" width="12" height="12" rx="2" fill="#5b8def"/>
<text x="470.0" y="256.0" class="m" font-size="13" font-weight="400" text-anchor="start">NVFP4</text>
<rect x="602" y="245" width="12" height="12" rx="2" fill="#8b5cf6"/>
<text x="620.0" y="256.0" class="m" font-size="13" font-weight="400" text-anchor="start">NVFP4 calibrated</text>
<rect x="452" y="269" width="12" height="12" rx="2" fill="#e3a008"/>
<text x="470.0" y="280.0" class="m" font-size="13" font-weight="400" text-anchor="start">FP8</text>
<rect x="602" y="269" width="12" height="12" rx="2" fill="#14b8a6"/>
<text x="620.0" y="280.0" class="m" font-size="13" font-weight="400" text-anchor="start">Q4_K</text>
<rect class="card" x="824" y="152" width="336" height="150" rx="10"/>
<text x="844.0" y="186.0" class="t" font-size="17" font-weight="600" text-anchor="start">Compressed checkpoint</text>
<text x="844.0" y="210.0" class="m" font-size="13" font-weight="400" text-anchor="start">runs on one RTX 5090 with SparkInfer</text>
<rect class="track" x="844" y="238" width="169.1" height="16" rx="3"/>
<rect x="844" y="238" width="116.4" height="16" rx="3" fill="#1a7f37" opacity="0.85"/>
<line class="gpu" x1="1013.1" y1="230" x2="1013.1" y2="262" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="1013.1" y="226.0" class="m" font-size="11" font-weight="400" text-anchor="middle">32 GB GPU</text>
<text x="844.0" y="282.0" fill="#1a7f37" font-size="13" font-weight="600" text-anchor="start">22 GB · fits, close to the original</text>
<path d="M388 227.0 h32" class="gpu" stroke-width="2" fill="none"/>
<path d="M420 221.0 l8 6 l-8 6 z" class="t"/>
<path d="M780 227.0 h32" class="gpu" stroke-width="2" fill="none"/>
<path d="M812 221.0 l8 6 l-8 6 z" class="t"/>
</svg>
