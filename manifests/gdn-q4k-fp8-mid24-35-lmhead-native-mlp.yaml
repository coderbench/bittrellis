schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-fp8-mid24-35-lmhead-native-mlp
description: >
  Q4_K on the recurrent projections of layers 1-63 except FP8 on the mid band 24-35, lm_head stored BF16 so
  its batch-1 Q4_K is fitted once, and every MLP and attention block on the shipped NVFP4 bytes. MLP Q4_K is
  what halves prefill in gdn-q4k-fp8-mid24-35-mlp-q4k (8.8K tok/s); recurrent Q4_K alone keeps about 13.9K
  (gdn-q4k-skip-layer0). The FP8 band and the once-fitted head lowered drift on top of both the shipped map
  (#63) and the Q4_K map (#62), so this tests whether they also do on the recurrent Q4_K map with native MLP,
  at a prefill no current frontier point offers for that drift. Layer 0 stays NVFP4 for the batched-prefill path.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.gdn.*"
    layers: "24-35"
    format: FP8
modules:
  lm_head: Q4_K
