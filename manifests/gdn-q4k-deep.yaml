schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-deep
description: >
  Q4_K on the recurrent projections of the deeper half only (layers 32-63). V4 puts all 144 GDN
  projections in Q4_K and clears the holdout; if the shallow half is where the recurrent state is
  most sensitive, half the map should keep most of the memory saving at less drift.
authors: [coderbench]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "32-63"
    format: Q4_K
