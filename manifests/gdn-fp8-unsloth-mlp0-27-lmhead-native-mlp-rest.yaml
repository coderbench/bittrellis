schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-unsloth-mlp0-27-lmhead-native-mlp-rest
description: >
  FP8 on every recurrent projection with lm_head fitted once from BF16 (#38: RP-KL 0.0967, prefill 13.8K,
  holdout PASS), plus the attested calibrated NVFP4 bytes on MLP layers 0-27, and every other MLP block on the
  shipped NVFP4 bytes. #70 adds the same calibrated bytes to the FP8 recurrent path but also puts Q4_K on MLP
  46-63, which moves prefill to 11.4K for 0.3 GiB. The calibrated bytes run on the NVFP4 kernels, so this keeps
  #38's prefill, decode and memory and takes the drift gain the early calibrated MLP gave on top of the FP8
  band in #65 and #71 (about 0.007-0.009), at a prefill about a fifth above #70.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    format: FP8
  - match: "L*.mlp"
    layers: "0-27"
    format: NVFP4
    quantizer: unsloth
modules:
  lm_head: Q4_K
