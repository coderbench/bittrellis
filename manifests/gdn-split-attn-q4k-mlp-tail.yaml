schema: bittrellis/manifest@2
track: HPC-01
name: gdn-split-attn-q4k-mlp-tail
description: >
  Keep layer-zero and most MLP units native; place Q4_K on shallow GDN qkv,
  deep GDN z/out, the final MLP block, attention from layer 3, and lm_head.
authors: [dato-bitar]
default: NVFP4
rules:
  - match: "L*.gdn.qkv"
    layers: "1-31"
    format: Q4_K
  - match: "L*.gdn.z"
    layers: "32-63"
    format: Q4_K
  - match: "L*.gdn.out"
    layers: "32-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "48-63"
    format: Q4_K
  - match: "L*.attn.*"
    layers: "3-63"
    format: Q4_K
  - match: "lm_head"
    format: Q4_K
