schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp-blockfit-rest-lmhead-q4k
description: >
  #28 (nvfp4_blockfit on every projection, lm_head fitted once: RP-KL 0.0992 at the shipped map's speed,
  prefill 16.9K) with every MLP block on nvfp4_gptq. On #93's and #86's maps the same change lowered drift by
  0.0055 and 0.0104 at identical speed and memory (#102, #104). Every projection stays NVFP4 on the shipped
  kernels, so this keeps V0's decode, prefill and memory at the lowest drift there.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
modules:
  lm_head: Q4_K
