schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-state-blockfit-attn-q4k
description: >
  #32 (FP8 recurrent qkv and z on layers 1-63, nvfp4_blockfit on every other NVFP4 projection, lm_head fitted
  once: RP-KL 0.0760, the lowest drift merged) with attention on runtime Q4_K. On the blockfit map the same
  change lowered drift by 0.0083 and peak memory by 0.17 GiB at equal decode (#28 to #91). Attention and the
  recurrent state are different units, so the gain should largely carry over, giving the lowest drift of any
  manifest at less memory than #32.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.gdn.z"
    layers: "1-63"
    format: FP8
modules:
  lm_head: Q4_K
