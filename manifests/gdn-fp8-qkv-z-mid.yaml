schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-qkv-z-mid
description: >
  FP8 on the recurrent qkv at every depth and on z in the shallowest layers (1-15); Q4_K on z from
  layer 16 and on out in the deep half (32-63). gdn-fp8-qkv-all-zo-split (#23) holds the fidelity side
  at 23.02 GiB and gdn-q4k-skip-layer0 (#7) the memory side at 21.64 GiB. Moving the FP8 z boundary
  from layer 31 to 15 keeps FP8 where shallow Q4_K costs tools and code, and returns memory on the
  middle z projections, aiming for a point between the two. Layer 0, attention and the MLP stay
  NVFP4, since MLP Q4_K costs about a third of prefill and attention Q4_K dropped the 32K needles.
authors: [Tet-9]
default: NVFP4
rules:
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.gdn.z"
    layers: "1-15"
    format: FP8
  - match: "L*.gdn.z"
    layers: "16-63"
    format: Q4_K
  - match: "L*.gdn.out"
    layers: "32-63"
    format: Q4_K
