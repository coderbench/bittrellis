schema: bittrellis/manifest@2
track: HPC-01
name: split-ranges-same-recipe
description: >
  Evaluator dry run. The same recipe as PR #1 with its rules written differently; the screen should
  mark it a duplicate without using the GPU.
authors: [coderbench]
default: NVFP4
rules:
  - match: "L*.gdn.qkv"
    layers: "48-63"
    format: FP8
  - match: "L*.mlp"
    layers: "28-55"
    format: NVFP4
    quantizer: unsloth
  - match: "L*.mlp"
    layers: "0-27"
    format: NVFP4
    quantizer: unsloth
