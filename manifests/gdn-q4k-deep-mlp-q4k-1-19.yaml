schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-deep-mlp-q4k-1-19
description: >
  GDN Q4_K on layers 32-63 plus MLP Q4_K on layers 1-19 only. Shallow MLP Q4_K cut public drift
  sharply (#6), but that gain was too specific to the public text. A shorter shallow span should keep
  a moderate, transferable share of it while saving enough memory to separate from #5 and #7.
authors: [harrythomasben]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "32-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-19"
    format: Q4_K
