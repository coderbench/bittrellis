schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-gptq-mlp0-24-47-gdn-fp8-qkv-attn-q4k-mlp-q4k-1-23-48-63-lmhead-q4k
description: >
  #97 (#93 with Q4_K on MLP 1-23 and 48-63: RP-KL 0.0763, prefill 10.3K, peak 21.99 GiB) with its 25 NVFP4 MLP
  blocks (0 and 24-47) on nvfp4_gptq instead of blockfit. On every map tried so far GPTQ on the MLP lowered drift
  at identical speed and memory (#102 -0.0055, #104 -0.0104, #106 -0.0102, #107 -0.0097); here it reaches the
  middle MLP blocks only, so the gain should be smaller but at #97's memory, below every other FP8-qkv result.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_gptq
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: FP8
  - match: "L*.mlp"
    layers: "1-23,48-63"
    format: Q4_K
modules:
  lm_head: Q4_K
