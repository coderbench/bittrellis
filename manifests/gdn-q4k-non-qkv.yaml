schema: bittrellis/manifest@2
track: HPC-01
name: gdn-q4k-non-qkv
description: >
  Q4_K on GDN z and out projections only; qkv (state-writing) stays NVFP4 baseline.
  Tests whether V4's long-context gain concentrates in qkv or spreads across
  all three GDN subcomponents, at lower prefill cost than full-GDN Q4_K.
authors: [Tet-9]
default: NVFP4
rules:
  - match: "L*.gdn.z"
    format: Q4_K
  - match: "L*.gdn.out"
    format: Q4_K
