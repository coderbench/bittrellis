schema: bittrellis/manifest@2
track: HPC-01
name: nvfp4-blockfit-gdn-q4k-qkv12-51-fp8-qkv-outer-attn-q4k-lmhead-q4k
description: >
  #86 (runtime Q4_K on recurrent qkv 1-63 and attention, nvfp4_blockfit on every other NVFP4 projection,
  lm_head fitted once: RP-KL 0.0858, decode 95.1) with FP8 on the recurrent qkv of the shallow and deep layers
  (1-11 and 52-63, 17 GDN layers) and Q4_K kept on the middle ones (12-51). In the middle, FP8 adds almost
  nothing over Q4_K qkv: #86 to #88 put FP8 on layers 24-35 and gained 0.0007. The 0.0115 that FP8 qkv
  1-63 gains over Q4_K qkv 1-63 (#86 to #93) must then come from the outer layers, so 17 of them should take a
  large share of it for about 2.2 tok/s of decode (0.13 tok/s per FP8 qkv layer, #28 to #80), between #86 and
  #95 (0.0796 at 91.5).
authors: [ShandyMaeCamingawan]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.gdn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.qkv"
    layers: "1-63"
    format: Q4_K
  - match: "L*.gdn.qkv"
    layers: "1-11,52-63"
    format: FP8
modules:
  lm_head: Q4_K
