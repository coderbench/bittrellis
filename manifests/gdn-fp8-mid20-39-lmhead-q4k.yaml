schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-mid20-39-lmhead-q4k
description: >
  The shipped NVFP4 map with FP8 on the recurrent projections of layers 20-39 and lm_head fitted once from
  BF16: gdn-fp8-mid24-35-lmhead-q4k with the band widened by four layers on each side (45 units instead of
  27). Measured on a pinned RTX 5090, the wider band lowers drift by a further 0.006 (paired, significant),
  mostly in maths and long context, for about 1.6% more decode and 2.6% more prefill; bands widened on one
  side only (20-35, 24-39, 20-37, 22-39) or further (24-47, 16-47) do worse for their cost. Every other
  recurrent layer, attention and the MLP keep the shipped bytes, so prompt reading stays near V0.
authors: [milosde111]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "20-39"
    format: FP8
modules:
  lm_head: Q4_K
