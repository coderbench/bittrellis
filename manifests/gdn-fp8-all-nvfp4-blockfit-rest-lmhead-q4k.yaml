schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-all-nvfp4-blockfit-rest-lmhead-q4k
description: >
  #32 (FP8 recurrent qkv and z on layers 1-63, nvfp4_blockfit on every other NVFP4 projection, lm_head fitted
  once: RP-KL 0.0760) with the recurrent out projections and recurrent layer 0 moved to FP8 as well, so the whole
  recurrent path is 8-bit and blockfit covers the MLP and attention blocks. Without blockfit the same step
  (gdn-state-fp8-skip0 to V3) lowered drift by 0.009, significant, mostly in long context and general text, for
  about 3% decode and 0.66 GiB. blockfit already lowers the NVFP4 error of the out projections, so the gain
  should be smaller but in the same sections, at the lowest drift of any manifest so far.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.mlp"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.attn.*"
    format: NVFP4
    quantizer: nvfp4_blockfit
  - match: "L*.gdn.*"
    format: FP8
modules:
  lm_head: Q4_K
