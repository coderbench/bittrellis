schema: bittrellis/manifest@2
track: HPC-01
name: gdn-attn-q4k-mlp-three-quarter-skip0
description: >
  After Survivor #47 (gdn-skip0-mlp-three-quarter: GDN 1-63 + MLP 1-23)
  closed eval:none/bt:dominated with RP-KL 0.1157, prefill -31.9%, FG-2 0%
  (covered by #37 gdn-attn-q4k-mlp-early8-mid24-skip0, RP-KL 0.1091), add
  full attention Q4_K — the ingredient #37 has that Survivor GDN+MLP-only
  recipes lacked — while keeping the three-quarter shallow MLP window
  (layers 1-23). Layer 0 GDN/MLP stay NVFP4. Distinct from #37 (early8+mid24),
  gdn-attn-q4k-mlp-mid (MLP 24-47, attn 3-63), #46/#47 (no attn), and pure-MLP
  Survivor splits. No local GPU numbers — evaluator re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.attn.*"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-23"
    format: Q4_K
