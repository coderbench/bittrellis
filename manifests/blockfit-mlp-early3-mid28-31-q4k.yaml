schema: bittrellis/manifest@2
track: HPC-01
name: blockfit-mlp-early3-mid28-31-q4k
description: Approved blockfit attention with sparse Q4_K MLP windows. Whole-map quality,
  performance, tasks and needles are unmeasured.
authors:
- dato-bitar
default: NVFP4
rules:
- match: L*.mlp
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.attn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.gdn.*
  format: NVFP4
  quantizer: nvfp4_blockfit
- match: L*.mlp
  layers: 1-3
  format: Q4_K
  quantizer: runtime
- match: L*.mlp
  layers: 28-31
  format: Q4_K
  quantizer: runtime
modules:
  lm_head: Q4_K
