schema: bittrellis/manifest@2
track: HPC-01
name: gdn-skip0-mlp-shallow
description: >
  Combine the two Survivor-adjacent frontier pieces that already clear holdout alone:
  gdn-q4k-skip-layer0 (RP-KL 0.1210 on hpc01-e5) and mlp-q4k-shallow (#41 layers 1-31,
  RP-KL 0.1238, FG-2 +0.001%). Full GDN+MLP skip0 (#15) paid eval:M but MLP 1-63 costs
  heavy prefill; #29 (GDN 1-63 + MLP 1-47) was frontier with eval:none. This keeps GDN
  Q4_K on layers 1-63 (layer 0 NVFP4 for batched-prefill) and narrows MLP Q4_K to the
  shallow half only (1-31), leaving deep MLP 32-63 + attention + lm_head on NVFP4.
  Hypothesis: shallow MLP adds memory beyond pure GDN-skip0 without the deep-MLP needle
  risk (#42/#6) or the full skip0-MLP prefill tax. Distinct from gdn-mlp-q4k-skip-layer0,
  #29, #21 (deep MLP), and #6 (deep GDN only). No local GPU numbers — evaluator re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "1-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-31"
    format: Q4_K
