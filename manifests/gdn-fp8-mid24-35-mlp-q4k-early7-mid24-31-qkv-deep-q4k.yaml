schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-mid24-35-mlp-q4k-early7-mid24-31-qkv-deep-q4k
description: >
  #63 (FP8 on the recurrent projections of layers 24-35, lm_head fitted once from BF16) plus Q4_K only where a
  fit over every measured hpc01-e4/e5 result says it lowers drift most per weight moved: MLP layers 1-7 and 24-31,
  the deep recurrent qkv (36-63) and z (36-39), and the recurrent out of layers 16-23. Q4_K costs prefill in
  proportion to the weights it touches but no decode, so this keeps #63's decode and spends about a sixth of its
  prefill for a drift close to the FP8 recipes, at peak memory near V0. Layer 0, attention and every other MLP
  keep the shipped NVFP4 bytes.
authors: [kaivexa]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "24-35"
    format: FP8
  - match: "L*.mlp"
    layers: "1-7,24-31"
    format: Q4_K
  - match: "L*.gdn.qkv"
    layers: "36-63"
    format: Q4_K
  - match: "L*.gdn.z"
    layers: "36-39"
    format: Q4_K
  - match: "L*.gdn.out"
    layers: "16-23"
    format: Q4_K
modules:
  lm_head: Q4_K
