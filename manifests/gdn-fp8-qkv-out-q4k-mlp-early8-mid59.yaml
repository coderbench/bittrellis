schema: bittrellis/manifest@2
track: HPC-01
name: gdn-fp8-qkv-out-q4k-mlp-early8-mid59
description: >
  Follow-up after Survivor #59 earned eval:XS / bt:frontier / bt:merge-first
  (RP-KL 0.0938, prefill 9,924, FG-2 +0.015%, holdout PASS) — best Survivor FG
  so far on the mid-end axis. Keep early 1-8; half-step mid-end between #59
  mid 24-55 (FG +0.015%) and #57 mid-deep 24-63 (FG +0.009%): set mid 24-59
  (36 MLP layers). Same FP8 GDN/out/lm_head map; attn stays all NVFP4 (#56
  deep attn Q4_K gate-fail). Do not reopen early-expand-toward-#49 (#58
  dominated) or NVFP4 early half-steps. Distinct from #55/#57/#59/#49.
  No local GPU numbers — evaluator re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    format: FP8
  - match: "L*.gdn.z"
    layers: "32-63"
    format: Q4_K
  - match: "L*.gdn.out"
    layers: "1-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "1-8"
    format: Q4_K
  - match: "L*.mlp"
    layers: "24-59"
    format: Q4_K
modules:
  lm_head: Q4_K
