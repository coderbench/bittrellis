schema: bittrellis/manifest@2
track: HPC-01
name: mlp-q4k-early-shallow
description: >
  After mlp-q4k-shallow (#41 layers 1-31) cleared holdout as frontier with the best
  RP-KL among its neighbors (0.1238) but only FG-2 +0.001% (prefill −26%), and
  mlp-q4k-late-shallow (#43 layers 16-31) was dominated (RP-KL 0.1290, FG-2 0%,
  prefill −14.6%), the late half alone clearly lost the fidelity that made #41
  frontier. This is the complementary early-shallow window: Q4_K MLP layers
  **1-15** only; layers 0 and 16-63 stay NVFP4. Hypothesis: early MLP was the
  fidelity driver in #41 (feasibility V7 also flagged early MLP), so a 15-layer
  early cut should beat #43's RP-KL while paying less prefill than the full
  1-31 shallow half. Attention, GDN, and lm_head stay NVFP4 (no attn Q4_K after
  #34/#39; no deep-MLP after #42 needle fail). Distinct from shallow-half,
  late-shallow, deep-half, and deep-quarter. No local GPU numbers — evaluator
  re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.mlp"
    layers: "1-15"
    format: Q4_K
