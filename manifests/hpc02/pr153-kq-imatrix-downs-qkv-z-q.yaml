schema: bittrellis/manifest@2
track: HPC-02
name: pr153-kq-imatrix-downs-qkv-z-q
description: >
  #153 (#142 with the attention q and o of layers 11-39 on Q4_K, every re-encoded tensor on kq_imat:
  RP-KL 0.0634, decode 460.3, prefill 40,141, 23.32 GiB) with kq_imatrix on the Q4_K tensors whose pinned
  input statistics it reads: every routed expert down, every recurrent qkv, the recurrent z of layers 20-39,
  and the attention q of layers 11-39. #158 made this swap on #147's downs and qkv only (RP-KL 0.0855 to
  0.0807, decode and memory unchanged). On #153 those two groups are still kq_imat, and kq_imatrix's GPTQ path
  also covers gdn.z and attn.q from attn_input.xtx, which #158 left on kq_imat. Recurrent out, attention o,
  lm_head and the embeddings have no pinned covariance and stay kq_imat; unsloth's gate/up and Q8_0 bytes
  stay. Formats, kernels, speed and memory stay #153's.
default: Q8_0
encoders: {Q4_K: unsloth_ud, Q5_K: unsloth_ud, Q6_K: unsloth_ud, Q8_0: unsloth_ud}
rules:
  - match: "L*.exps.gate"
    format: Q4_K
  - match: "L*.exps.up"
    format: Q4_K
  - match: "L*.exps.down"
    format: Q4_K
    encoder: kq_imatrix
  - match: "L*.gdn.qkv"
    format: Q4_K
    encoder: kq_imatrix
  - match: "L*.gdn.z"
    layers: "20-39"
    format: Q4_K
    encoder: kq_imatrix
  - match: "L*.gdn.out"
    layers: "20-39"
    format: Q4_K
    encoder: kq_imat
  - match: "L*.attn.q"
    layers: "11-39"
    format: Q4_K
    encoder: kq_imatrix
  - match: "L*.attn.o"
    layers: "11-39"
    format: Q4_K
    encoder: kq_imat
modules:
  lm_head: {format: Q4_K, encoder: kq_imat}
  embed: {format: Q4_K, encoder: kq_imat}
