schema: bittrellis/manifest@2
track: HPC-01
name: mlp-q4k-deep-quarter
description: >
  Alternate after attn-q4k-deep (#34) gate-failed on long-32k needles. Avoids
  attention Q4_K entirely (known needle risk per #23/#34). Puts Q4_K only on the
  deepest quarter of MLP blocks (layers 48-63), leaving MLP 0–47 and all attention/
  GDN/lm_head on NVFP4. Narrower than merged mlp-q4k-skip-layer0 (1-63); tests
  whether a thin deep-MLP Q4_K slice still passes quality gates with a measurable
  memory cut. No local GPU numbers — evaluator re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.mlp"
    layers: "48-63"
    format: Q4_K
