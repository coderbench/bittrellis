schema: bittrellis/manifest@2
track: HPC-01
name: attn-q4k-deep
description: >
  Q4_K on attention projections in the deeper half only (layers 32-63 → attention
  layers 35,39,…,63). V5 Q4_Ks every attention unit and loses tasks; merged
  gdn-attn-q4k-mlp-mid starts attention at layer 3 and, per the #23 write-up,
  attention Q4_K with only layer 3 left native can drop 32K needles. The same
  depth split that let gdn-q4k-deep keep prefill should let deep-only attention
  Q4_K take a slice of V5's memory saving while leaving the shallow attention
  stack (3–31) on NVFP4 to protect retrieval. GDN, MLP, lm_head, and layer 0
  stay NVFP4. No local GPU numbers — evaluator re-measures.
authors: [SurvivorAI0817]
default: NVFP4
rules:
  - match: "L*.attn.*"
    layers: "32-63"
    format: Q4_K
