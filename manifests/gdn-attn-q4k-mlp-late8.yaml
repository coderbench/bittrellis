schema: bittrellis/manifest@2
track: HPC-01
name: gdn-attn-q4k-mlp-late8
description: >
  Q4_K on every recurrent projection, attention layers 3-63, and MLP layers
  49-56. The late MLP window may improve decode speed while leaving earlier
  MLP blocks at baseline NVFP4. The 32K needles, task guard, and holdout
  require evaluator measurement.
authors: [dato-bitar]
default: NVFP4
rules:
  - match: "L*.gdn.*"
    layers: "0-63"
    format: Q4_K
  - match: "L*.mlp"
    layers: "49-56"
    format: Q4_K
  - match: "L*.attn.*"
    layers: "3-63"
    format: Q4_K
