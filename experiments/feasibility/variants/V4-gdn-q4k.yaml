schema: bittrellis/manifest@2
track: HPC-01
name: V4-gdn-q4k
description: >
  All GDN projections as Q4_K fitted from BF16. SparkInfer's own A/B of a Q4_K refit of NVFP4
  measured +19-23% decode; a fit from BF16 avoids the double quantization it paid for.
default: NVFP4
rules:
  - match: "L*.gdn.*"
    format: Q4_K
