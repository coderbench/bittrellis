# HPC-01 — Qwen3.8-27B precision topology on one RTX 5090, pinned SparkInfer.
# Every number a result depends on is pinned here. Changing any pin creates a new track version.
track: HPC-01
version: 1
title: Qwen3.8-27B × 1× RTX 5090 × SparkInfer 0.5.8

model:
  # Source of truth for weights: every BF16 tensor in a candidate must be byte-identical to it,
  # and every quantized tensor must be a faithful encoding of it.
  base:
    repo: Qwen/Qwen3.8-27B
    revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    dtype: bfloat16
  # The checkpoint SparkInfer ships and scores: ModelOpt NVFP4 on all 400 Linears + lm_head.
  # It is reference point R0 and the source of `quantizers.NVFP4: baseline` bytes.
  baseline:
    repo: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    revision: 5b7a687fc8211a5d631c8ca6a593dd37eb26ce33
  # Files copied verbatim from the baseline into every candidate.
  aux_files:
    - chat_template.jinja
    - generation_config.json
    - merges.txt
    - preprocessor_config.json
    - processor_config.json
    - tokenizer.json
    - tokenizer_config.json
    - video_preprocessor_config.json
    - vocab.json
    - LICENSE

runtime:
  repo: gittensor-ai-lab/sparkinfer
  commit: b1ed168e3931d22d66dfa0aed3bcc2684f2b8387   # v0.5.8
  cuda: "12.8"
  cmake_args: [-DCMAKE_BUILD_TYPE=Release, -DCMAKE_CUDA_ARCHITECTURES=120, -DBUILD_SERVER=ON, -DBUILD_TESTS=OFF]
  targets: [qwen3_gguf_bench, qwen3_gguf_score, sparkinfer_server]
  # Every SPARKINFER_* variable is removed from the environment before a run; only these are set.
  # Runtime knobs are part of the runtime, not of the candidate.
  env: {}

hardware:
  gpu: NVIDIA GeForce RTX 5090
  count: 1
  vram_mib: 32607

# External precision maps of the same model, measured with the same harness.
references:
  R0:
    name: gittensor NVFP4 (SparkInfer's shipped checkpoint)
    kind: sparkinfer
    repo: gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090
    revision: 5b7a687fc8211a5d631c8ca6a593dd37eb26ce33
  R1:
    name: unsloth NVFP4 (hand-tuned mixed NVFP4/FP8)
    kind: sparkinfer
    repo: unsloth/Qwen3.8-27B-NVFP4
    revision: f0b7c9e722f5565102fff8481c99e4d86ae099c7
  R2:
    name: llama.cpp + unsloth UD-Q4_K_M (imatrix dynamic GGUF)
    kind: llama.cpp
    repo: unsloth/Qwen3.8-27B-GGUF
    revision: 4ca720788d1e01f1bff70c033e0d0028fd02e502
    file: Qwen3.8-27B-UD-Q4_K_M.gguf
    llama_cpp_commit: d8df12ebc4592b55dcecf97a32953623d031efdc
  R3:
    name: NVIDIA NVFP4 (FP8 attention + GDN)
    kind: unloadable
    repo: nvidia/Qwen3.8-27B-NVFP4
    revision: dbb8f445b3145f8a4c18ddc769f032d57d32867c
    reason: per-tensor FP8 scales; the pinned loader accepts only per-row FP8 scales

evaluation:
  corpus:
    version: hpc01-public-v2
    tokenizer: baseline
  score:
    topk: 128            # candidate top-k per position; KL uses the reference top-64 + tail bucket
    reference_topk: 64
    env:
      SPARKINFER_DETERMINISTIC: "1"
  performance:
    contexts: [128, 4096, 16384]
    reps: 2
    decode_tokens: 128
    primary_context: 4096
  tasks:
    tier: benchmark      # SparkInfer bench/quality benchmark tier, 196 items, greedy
    server_ctx: 8192

frontier:
  # The three official objectives. Everything else is reported, not ranked.
  objectives:
    kl: min              # mean KL(BF16 || candidate) over the public corpus, nats/token
    decode_tps: max      # batch-1 decode tok/s at primary_context
    vram_gib: min        # device memory in use after load at max context
  # Normalization box for Frontier Gain (hypervolume). Versioned with the track.
  box:
    kl: [0.0, 0.30]
    decode_tps: [60.0, 120.0]
    vram_gib: [20.0, 32.0]

gates:
  kl_max: 0.30             # hard quality floor; also the box edge above
  top1_min: 0.80
  needle_min: 1.0          # fraction of long-context needle answers the candidate must keep
  task_max_drop_items: 6   # per-suite pass-count drop vs R0 tolerated (binomial noise at n<=75)
  load_must_succeed: true
